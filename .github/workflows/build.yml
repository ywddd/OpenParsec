name: Xcode - Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release__nightly:
        description: Create a nightly release
        type: boolean
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build using xcodebuild command
    runs-on: macos-15-intel
    env:
      scheme: OpenParsec
      archive_path: archive
    outputs:
      scheme: ${{ steps.scheme.outputs.scheme }}
      archive_path: ${{ env.archive_path }}

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Set Scheme
        id: scheme
        run: |
          if [ $scheme = default ]
          then
            scheme_list=$(xcodebuild -list -json | tr -d "\n")
            scheme=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
            echo Using default scheme: $scheme
          else
            echo Using configured scheme: $scheme
          fi
          echo "scheme=$scheme" >> $GITHUB_OUTPUT
      - name: Set filetype_parameter
        id: filetype_parameter
        run: |
          filetype_parameter=`ls -A | grep -i \\.xcworkspace\$ && echo workspace || echo project`
          echo "filetype_parameter=$filetype_parameter" >> $GITHUB_OUTPUT
      - name: Set file_to_build
        id: file_to_build
        run: |
          file_to_build=`ls -A | grep -i \\.xcworkspace\$ || ls -A | grep -i \\.xcodeproj\$`
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          echo "file_to_build=$file_to_build" >> $GITHUB_OUTPUT
      - name: Set Build Number
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" OpenParsec/Info.plist
      - name: Verify stream geometry and adaptive outcomes
        run: |
          python3 - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path

          source = r'''
          import Foundation
          import CoreGraphics

          func near(_ actual: CGFloat, _ expected: CGFloat, _ label: String, tolerance: CGFloat = 0.01) {
              precondition(actual.isFinite && abs(actual - expected) <= tolerance, "\(label): \(actual) != \(expected)")
          }

          let viewport = CGSize(width: 2622, height: 1206)
          let decodedSize = CGSize(width: 1920, height: 886)
          let sdkSize = CGSize(width: 2880, height: 1800)
          let decoded = StreamGeometry(viewportSize: viewport, hostSize: decodedSize)
          near(decoded.pictureSize.height, 1206, "matching frame fills height")
          near(decoded.pictureSize.width, 2613.45372, "matching frame fills width", tolerance: 0.1)
          precondition(decoded.pictureRect.minX < 5 && decoded.pictureRect.minY < 0.01, "matching frame must not have four-sided shrink")
          let rejected = StreamGeometry(viewportSize: viewport, hostSize: sdkSize)
          near(rejected.pictureSize.width, 1929.6, "unmatched frame has side bars only")
          near(rejected.pictureSize.height, 1206, "unmatched frame still fills height")
          let native = StreamGeometry(viewportSize: viewport, hostSize: viewport)
          near(native.pictureSize.width, 2622, "native frame fills width")
          near(native.pictureSize.height, 1206, "native frame fills height")
          near(native.pictureOrigin.x, 0, "native frame has no side bars")
          near(native.pictureOrigin.y, 0, "native frame has no top bars")
          let portrait = StreamGeometry(viewportSize: CGSize(width: 1206, height: 2622), hostSize: sdkSize)
          near(portrait.pictureSize.width, 1206, "portrait native fit width")
          near(portrait.pictureSize.height, 753.75, "portrait native fit height")
          near(portrait.pictureOrigin.y, 934.125, "portrait native fit centered")

          let sdkGeometry = StreamGeometry(viewportSize: viewport, hostSize: sdkSize)
          let fractions = [CGPoint.zero, CGPoint(x: 1, y: 0), CGPoint(x: 0, y: 1), CGPoint(x: 1, y: 1), CGPoint(x: 0.5, y: 0.5)]
          for fraction in fractions {
              let hostPoint = CGPoint(x: decodedSize.width * fraction.x, y: decodedSize.height * fraction.y)
              let screenPoint = decoded.screenPoint(forHostPoint: hostPoint)
              let restored = decoded.hostPoint(forScreenPoint: screenPoint)
              near(restored.x, hostPoint.x, "host-screen round trip x")
              near(restored.y, hostPoint.y, "host-screen round trip y")
              let sdkPoint = decoded.sdkPoint(forViewportPoint: screenPoint, sdkHostSize: sdkSize)
              let expectedSDK = sdkGeometry.screenPoint(forHostPoint: CGPoint(x: sdkSize.width * fraction.x, y: sdkSize.height * fraction.y))
              near(sdkPoint.x, expectedSDK.x, "different decoder/frame SDK projection x")
              near(sdkPoint.y, expectedSDK.y, "different decoder/frame SDK projection y")
              let returned = decoded.viewportPoint(forSDKPoint: sdkPoint, sdkHostSize: sdkSize)
              near(returned.x, screenPoint.x, "SDK-screen round trip x")
              near(returned.y, screenPoint.y, "SDK-screen round trip y")
              let oldHost = sdkGeometry.hostPoint(forScreenPoint: expectedSDK)
              let updatedHost = CGPoint(x: oldHost.x / sdkSize.width * decodedSize.width, y: oldHost.y / sdkSize.height * decodedSize.height)
              let updatedSDK = decoded.screenPoint(forHostPoint: updatedHost)
              near(updatedSDK.x, screenPoint.x, "decoder metadata change preserves normalized cursor x")
              near(updatedSDK.y, screenPoint.y, "decoder metadata change preserves normalized cursor y")
          }

          let target = AdaptiveHostResolution.target(for: CGSize(width: 874, height: 402), nativeScale: 3)!
          precondition(target == AdaptiveHostResolution(width: 2622, height: 1206), "prefer host-supported native phone resolution")
          let oddTarget = AdaptiveHostResolution.target(for: CGSize(width: 2200, height: 1015), nativeScale: 1)!
          precondition(oddTarget == AdaptiveHostResolution(width: 2200, height: 1016), "nearest-even native target")
          let largeTarget = AdaptiveHostResolution.target(for: CGSize(width: 2200, height: 1015), nativeScale: 3)!
          precondition(largeTarget == AdaptiveHostResolution(width: 3840, height: 1772), "4K-cap preserves aspect")
          precondition(AdaptiveHostResolution.target(for: CGSize(width: 1015, height: 2200), nativeScale: 3) == nil, "portrait must not request landscape resolution")
          precondition(AdaptiveHostResolution.nearestEven(100.6) == 100 && AdaptiveHostResolution.nearestEven(101.6) == 102, "direct nearest-even rounding")
          var tracker = AdaptiveResolutionRequestTracker(target: target, requestedAt: 0)
          precondition(tracker.observe(frame: StreamPixelSize(sdkSize), now: 1, timeout: 6).isWaiting, "sent is not accepted")
          precondition(tracker.observe(frame: StreamPixelSize(sdkSize), now: 7, timeout: 6) == .unmatched(target), "unmatched host must be exposed")
          precondition(tracker.observe(frame: StreamPixelSize(width: 2622, height: 1206), now: 8, timeout: 6) == .matched(target), "late accepted frame resolves timeout")
          let touchViewport = CGSize(width: 400, height: 800)
          let initialOffset = CGPoint(x: 120, y: 240)
          let contentAnchor = StreamViewportMath.contentAnchor(at: CGPoint(x: 150, y: 250), zoomScale: 2, contentOffset: initialOffset)
          let zoomOffset = StreamViewportMath.contentOffset(anchoring: contentAnchor, at: CGPoint(x: 180, y: 270), zoomScale: 3, contentSize: touchViewport, viewportSize: touchViewport)
          near(zoomOffset.x, 225, "pinch keeps horizontal anchor with midpoint translation")
          near(zoomOffset.y, 465, "pinch keeps vertical anchor with midpoint translation")
          let translateOnly = StreamViewportMath.contentOffset(anchoring: contentAnchor, at: CGPoint(x: 180, y: 270), zoomScale: 2, contentSize: touchViewport, viewportSize: touchViewport)
          near(translateOnly.x, 90, "unchanged pinch distance still pans horizontally")
          near(translateOnly.y, 220, "unchanged pinch distance still pans vertically")
          let pan = StreamViewportMath.pannedOffset(from: initialOffset, translation: CGPoint(x: 60, y: 100), contentSize: touchViewport, viewportSize: touchViewport, zoomScale: 2)
          near(pan.x, 60, "pan follows finger horizontally")
          near(pan.y, 140, "pan follows finger vertically")
          let keyboardViewport = StreamViewportMath.keyboardVisibleViewport(viewportSize: CGSize(width: 874, height: 402), keyboardHeight: 260)
          near(keyboardViewport.width, 874, "keyboard pan keeps full viewport width")
          near(keyboardViewport.height, 142, "keyboard pan uses uncovered screen height")
          let keyboardPanAtOneX = StreamViewportMath.pannedOffset(
              from: .zero,
              translation: CGPoint(x: -200, y: -200),
              contentSize: CGSize(width: 874, height: 402),
              viewportSize: CGSize(width: 874, height: 402),
              zoomScale: 1,
              visibleViewport: keyboardViewport
          )
          near(keyboardPanAtOneX.x, 0, "one-times keyboard pan remains horizontally clamped")
          near(keyboardPanAtOneX.y, 200, "one-times keyboard pan reveals desktop above keyboard")
          let keyboardPanAtTwoX = StreamViewportMath.pannedOffset(
              from: .zero,
              translation: CGPoint(x: -2000, y: -2000),
              contentSize: CGSize(width: 874, height: 402),
              viewportSize: CGSize(width: 874, height: 402),
              zoomScale: 2,
              visibleViewport: keyboardViewport
          )
          near(keyboardPanAtTwoX.x, 874, "two-times keyboard pan clamps horizontal edge")
          near(keyboardPanAtTwoX.y, 662, "two-times keyboard pan clamps below visible viewport")
          let upper = StreamViewportMath.clampedOffset(CGPoint(x: 9999, y: 9999), contentSize: touchViewport, viewportSize: touchViewport, zoomScale: 2)
          near(upper.x, 400, "right edge clamp")
          near(upper.y, 800, "bottom edge clamp")
          precondition(StreamViewportMath.clampedOffset(CGPoint(x: -100, y: -100), contentSize: touchViewport, viewportSize: touchViewport, zoomScale: 2) == .zero, "top and left edge clamp")
          precondition(StreamViewportMath.clampedOffset(initialOffset, contentSize: touchViewport, viewportSize: touchViewport, zoomScale: 1) == .zero, "reset viewport fits at one times")
          let startTouch = StreamTwoFingerSample(distance: 100, midpoint: CGPoint(x: 100, y: 100))
          let pinchTouch = StreamTwoFingerSample(distance: 150, midpoint: CGPoint(x: 100, y: 100))
          let moveTouch = StreamTwoFingerSample(distance: 100, midpoint: CGPoint(x: 150, y: 140))
          precondition(StreamViewportMath.classifyTwoFinger(start: startTouch, current: startTouch, zoomEnabled: true, isZoomed: true) == .undecided, "two finger tap doesn't navigate")
          precondition(StreamViewportMath.classifyTwoFinger(start: startTouch, current: pinchTouch, zoomEnabled: true, isZoomed: true) == .zoom, "already zoomed can still pinch")
          precondition(StreamViewportMath.classifyTwoFinger(start: startTouch, current: moveTouch, zoomEnabled: true, isZoomed: true) == .pan, "zoomed translation navigates viewport not host wheel")
          precondition(StreamViewportMath.classifyTwoFinger(start: startTouch, current: moveTouch, zoomEnabled: false, isZoomed: true) == .pan, "pan remains available when pinch disabled")
          precondition(StreamViewportMath.classifyTwoFinger(start: startTouch, current: moveTouch, zoomEnabled: true, isZoomed: false) == .scroll, "one times two finger translation scrolls remote app")
          func textPlan(_ text: String, mode: TextInputMode = .text) -> RemoteInputPlan {
              switch RemoteInputPolicy.makePlan(text: text, mode: mode, shortcut: .controlV) {
              case .success(let plan): return plan
              case .failure(let failure): preconditionFailure("unexpected text plan failure: \(failure)")
              }
          }
          precondition(textPlan("你好👩‍💻").actions == [.pasteText("你好👩‍💻")], "committed CJK and emoji stay Unicode text")
          precondition(textPlan("ENTER").actions == [.pasteText("ENTER")], "literal text is not a named key")
          precondition(textPlan("你好\r\nworld\t!").actions == [.pasteText("你好"), .keyPress("ENTER"), .pasteText("world"), .keyPress("TAB"), .pasteText("!")], "text and special key order preserved")
          precondition(textPlan("abc123", mode: .keys).actions == [.keyPress("a"), .keyPress("b"), .keyPress("c"), .keyPress("1"), .keyPress("2"), .keyPress("3")], "multi-character key input isn't dropped")
          precondition(textPlan("ENTER", mode: .keys).actions == [.keyPress("E"), .keyPress("N"), .keyPress("T"), .keyPress("E"), .keyPress("R")], "committed ASCII never interpreted as a shortcut name")
          precondition(textPlan("你好\nA").actions.reduce(0) { $0 + $1.byteCount } == 8, "production queue byte accounting matches Unicode and keys")
          precondition(RemoteInputPolicy.keyNames(for: "\r\n") == ["ENTER"], "CRLF is one return")
          precondition(RemoteInputPolicy.makePlan(text: "中文", mode: .keys, shortcut: .controlV) == .failure(.unsupportedUnicode), "unsupported Unicode key input explicit")
          precondition(RemoteInputPolicy.makePlan(text: "a\0b", mode: .text, shortcut: .controlV) == .failure(.unsupportedUnicode), "NUL cannot truncate remote text")
          precondition(RemoteInputPolicy.makePlan(text: String(repeating: "a", count: RemoteInputPolicy.maxTextBytes + 1), mode: .text, shortcut: .controlV) == .failure(.tooLong), "text size bounded")
          let family = "👩‍👩‍👧‍👦"
          switch RemoteInputPolicy.utf8Chunks(of: "你" + family + "好", maxBytes: family.utf8.count) {
          case .success(let chunks):
              precondition(chunks.joined() == "你" + family + "好", "chunks preserve original Unicode")
              precondition(chunks.contains(family) && chunks.allSatisfy { $0.utf8.count <= family.utf8.count }, "chunks never split a composed character")
          case .failure: preconditionFailure("valid Unicode chunking rejected")
          }
          precondition(RemoteInputPolicy.utf8Chunks(of: family, maxBytes: 4) == .failure(.tooLong), "oversize grapheme fails rather than corrupting")
          precondition(RemoteInputPolicy.pasteChord(for: .controlV) == RemotePasteChord(modifierKeyCode: 224, keyCode: 25), "Windows paste shortcut")
          precondition(RemoteInputPolicy.pasteChord(for: .commandV) == RemotePasteChord(modifierKeyCode: 227, keyCode: 25), "macOS paste shortcut")
          var mouseButtons = VirtualMouseButtonReducer()
          precondition(mouseButtons.down(.left).pressed == [.left], "left down once")
          precondition(mouseButtons.down(.left).pressed.isEmpty, "duplicate down inert")
          precondition(mouseButtons.down(.right).pressed == [.right], "independent right button")
          precondition(mouseButtons.up(.left).released == [.left] && mouseButtons.held == [.right], "release only ended finger")
          precondition(mouseButtons.cancelAll().released == [.right] && mouseButtons.held.isEmpty, "cancel releases remaining buttons")
          precondition(mouseButtons.cancelAll().released.isEmpty, "repeat cancel inert")
          for size in [CGSize(width: 393, height: 852), CGSize(width: 852, height: 393), CGSize(width: 375, height: 667)] {
              for scale in [VirtualMouseConfiguration.minimumScale, 1, VirtualMouseConfiguration.maximumScale] {
                  let configuration = VirtualMouseConfiguration(enabled: true, scale: scale, normalizedPosition: CGPoint(x: 0.8, y: 0.65))
                  let presentation = VirtualMouseGeometry.presentation(configuration: configuration, in: CGRect(origin: .zero, size: size), insets: VirtualMouseInsets(top: 8, left: 8, bottom: 34, right: 8), collapsed: false)
                  precondition(!presentation.isCollapsed, "phone screen fits an expanded mouse")
                  precondition(presentation.bodyFrame.width >= 131.99 && presentation.bodyFrame.width <= 160.01, "mouse remains compact across supported sizes")
                  let layout = presentation.localizedToBody.layout!
                  precondition(layout.isValid && layout.isContainedInBody, "controls have safe hit regions")
                  precondition(layout.bodyFrame.origin == .zero, "drawing and hit testing use local origin")
                  near(layout.bodyFrame.width, 136 * scale, "requested size stays expanded")
                  precondition(layout.leftButtonFrame.width >= 44 && layout.leftButtonFrame.height >= 44 && layout.rightButtonFrame.width >= 44 && layout.rightButtonFrame.height >= 44, "both primary buttons remain usable")
                  precondition(VirtualMouseGeometry.interaction(at: CGPoint(x: layout.leftButtonFrame.midX, y: layout.leftButtonFrame.midY), layout: layout) == .button(.left), "local left hit")
                  precondition(VirtualMouseGeometry.interaction(at: CGPoint(x: layout.rightButtonFrame.midX, y: layout.rightButtonFrame.midY), layout: layout) == .button(.right), "local right hit")
                  precondition(VirtualMouseGeometry.interaction(at: CGPoint(x: layout.wheelFrame.midX, y: layout.wheelFrame.midY), layout: layout) == .wheel, "compact wheel hit")
                  precondition(layout.wheelFrame.width >= 44 && layout.wheelFrame.width <= 52, "wheel hit lane width")
                  precondition(layout.wheelFrame.height >= 72 && layout.wheelFrame.height <= 84, "wheel hit lane height")
                  precondition(layout.leftButtonFrame.minY / layout.bodyFrame.height >= 0.05 && layout.leftButtonFrame.minY / layout.bodyFrame.height <= 0.07, "left paddle starts at mouse head")
                  precondition(layout.leftButtonFrame.maxY / layout.bodyFrame.height >= 0.49 && layout.leftButtonFrame.maxY / layout.bodyFrame.height <= 0.51, "left paddle ends above palm")
                  precondition(layout.rightButtonFrame.minY == layout.leftButtonFrame.minY && layout.rightButtonFrame.maxY == layout.leftButtonFrame.maxY, "paired paddles align")
                  let wheelOverlapProbe = CGPoint(x: layout.wheelFrame.minX + 1, y: layout.leftButtonFrame.midY)
                  precondition(layout.leftButtonFrame.contains(wheelOverlapProbe), "wheel lane can overlay button frame")
                  precondition(VirtualMouseGeometry.buttonPath(.left, layout: layout).contains(wheelOverlapProbe), "wheel lane overlaps visible left paddle")
                  precondition(VirtualMouseGeometry.interaction(at: wheelOverlapProbe, layout: layout) == .wheel, "wheel hit priority wins central lane")
                  let rightOverlapProbe = CGPoint(x: layout.wheelFrame.maxX - 1, y: layout.rightButtonFrame.midY)
                  precondition(VirtualMouseGeometry.buttonPath(.right, layout: layout).contains(rightOverlapProbe), "wheel lane overlaps visible right paddle")
                  precondition(VirtualMouseGeometry.interaction(at: rightOverlapProbe, layout: layout) == .wheel, "wheel wins over right paddle too")
                  let track = VirtualMouseGeometry.wheelTrackFrame(layout: layout)
                  precondition(track.width <= 14 && track.height >= 30 && track.height <= 38, "visible wheel stays narrow and compact")
                  precondition(layout.wheelFrame.contains(track), "visible track belongs to wheel hit lane")
                  for horizontal in [layout.wheelFrame.minX + 1, layout.wheelFrame.midX, layout.wheelFrame.maxX - 1] {
                      for vertical in [layout.wheelFrame.minY + 1, layout.wheelFrame.midY, layout.wheelFrame.maxY - 1] {
                          precondition(VirtualMouseGeometry.interaction(at: CGPoint(x: horizontal, y: vertical), layout: layout) == .wheel, "entire thumb lane scrolls rather than moving cursor")
                      }
                  }
                  var wheelRemainder: CGFloat = 0
                  var wheelTotal: Int32 = 0
                  for _ in 0..<40 {
                      let result = VirtualMouseGeometry.wheelUnits(for: 0.5, sensitivity: 1.5, remainder: wheelRemainder)
                      wheelTotal += result.units
                      wheelRemainder = result.remainder
                  }
                  precondition(wheelTotal == 69, "20pt thumb drag emits sensitivity-scaled scroll units")
                  precondition(VirtualMouseGeometry.wheelUnits(for: 40, sensitivity: 1.5, remainder: 0).units == 138, "40pt drag emits sensitivity-scaled units")
                  precondition(VirtualMouseGeometry.wheelUnits(for: -20, sensitivity: 1.5, remainder: 0).units == -69, "reverse thumb drag reverses scroll")
                  precondition(VirtualMouseGeometry.wheelUnits(for: 0, sensitivity: 1.5, remainder: 0.5).units == 0, "stationary finger preserves fractional scroll without emitting")
                  precondition(VirtualMouseGeometry.wheelHoldUnits(direction: 1, sensitivity: 1.5, remainder: 0).units == 1, "held wheel continues in the last downward direction")
                  precondition(VirtualMouseGeometry.wheelHoldUnits(direction: -1, sensitivity: 1.5, remainder: 0).units == -1, "held wheel continues in the last upward direction")
                  let idleHold = VirtualMouseGeometry.wheelHoldUnits(direction: 0, sensitivity: 1.5, remainder: 0.4)
                  precondition(idleHold.units == 0 && idleHold.remainder == 0.4, "idle hold without a wheel drag never scrolls")
                  precondition(VirtualMouseGeometry.wheelMeaningfulMovement >= 4, "hold repeat requires a deliberate drag")
                  let closeGlyph = VirtualMouseGeometry.collapseGlyphFrame(layout: layout)
                  precondition(closeGlyph.width == 16 && layout.collapseButtonFrame.width == 24 && layout.collapseButtonFrame.minY / layout.bodyFrame.height > 0.7, "small close control sits at tail")
                  precondition(VirtualMouseGeometry.interaction(at: CGPoint(x: layout.collapseButtonFrame.midX, y: layout.collapseButtonFrame.midY), layout: layout) == .collapse, "compact collapse hit")
                  precondition(VirtualMouseGeometry.interaction(at: CGPoint(x: layout.moveFrame.midX, y: layout.moveFrame.midY), layout: layout) == .move, "palm area moves pointer")
                  precondition(layout.moveFrame.height >= 40, "palm remains reachable at minimum supported height")
                  precondition(layout.collapseButtonFrame.maxY <= layout.bodyFrame.maxY - 0.99, "tail control keeps a safe bottom margin")
                  precondition(!layout.moveFrame.intersects(layout.wheelFrame) && !layout.moveFrame.intersects(layout.collapseButtonFrame), "palm excludes wheel and tail control")
                  precondition(layout.resizeHandleFrame.isEmpty && layout.middleButtonFrame.isEmpty, "obsolete resize and text controls are removed")
                  precondition(VirtualMouseGeometry.contains(CGPoint(x: layout.bodyFrame.midX, y: layout.bodyFrame.midY), in: presentation.localizedToBody), "mouse body hit region is active")
                  precondition(!VirtualMouseGeometry.contains(CGPoint(x: -1, y: -1), in: presentation.localizedToBody), "transparent area does not intercept touches")
                  precondition(VirtualMouseGeometry.interaction(at: CGPoint(x: layout.bodyFrame.maxX + 2, y: layout.bodyFrame.midY), layout: layout) == nil, "transparent outside edge has no interaction")
                  for corner in [CGPoint(x: 2, y: 2), CGPoint(x: layout.bodyFrame.maxX - 2, y: 2), CGPoint(x: 2, y: layout.bodyFrame.maxY - 2), CGPoint(x: layout.bodyFrame.maxX - 2, y: layout.bodyFrame.maxY - 2)] {
                      precondition(!VirtualMouseGeometry.contains(corner, in: presentation.localizedToBody) && VirtualMouseGeometry.interaction(at: corner, layout: layout) == nil, "transparent bounding-box corners pass touches through")
                  }
              }
          }
          let defaultMouse = VirtualMouseGeometry.presentation(
              configuration: VirtualMouseConfiguration(enabled: true, scale: VirtualMouseConfiguration.defaultScale, normalizedPosition: VirtualMouseConfiguration.defaultPosition),
              in: CGRect(x: 0, y: 0, width: 393, height: 852),
              insets: VirtualMouseInsets(top: 8, left: 8, bottom: 34, right: 8),
              collapsed: false
          )
          precondition(!defaultMouse.isCollapsed, "default mouse remains expanded on a phone viewport")
          var launcherDrag = VirtualMouseLauncherDrag(startPoint: CGPoint(x: 10, y: 10))
          precondition(launcherDrag.move(to: CGPoint(x: 13, y: 13)) == .zero && !launcherDrag.isDragging, "collapsed mouse tap stays a tap")
          precondition(launcherDrag.move(to: CGPoint(x: 30, y: 24)) == CGPoint(x: 20, y: 14) && launcherDrag.isDragging, "collapsed mouse starts moving after threshold")
          precondition(launcherDrag.shouldExpand(at: CGPoint(x: 10, y: 10), cancelled: false) == false, "dragged launcher does not expand on lift")
          let compactMouse = VirtualMouseGeometry.presentation(configuration: VirtualMouseConfiguration(enabled: true, scale: 1, normalizedPosition: CGPoint(x: 1, y: 1)), in: CGRect(x: 0, y: 0, width: 393, height: 140), collapsed: false)
          precondition(compactMouse.isCollapsed && compactMouse.bodyFrame.width == 46 && compactMouse.bodyFrame.height == 46, "keyboard constrained mouse stays recoverable")
          print("Stream geometry, screenshot regression, SDK mapping and adaptive outcomes passed")
          '''
          with tempfile.TemporaryDirectory(prefix='openparsec-geometry-') as temporary:
              main_path = Path(temporary) / 'main.swift'
              binary_path = Path(temporary) / 'geometry-check'
              main_path.write_text(source, encoding='utf-8')
              subprocess.run(['swiftc', 'OpenParsec/StreamGeometry.swift', 'OpenParsec/RemoteInputPolicy.swift', 'OpenParsec/VirtualMousePolicy.swift', str(main_path), '-o', str(binary_path)], check=True)
              subprocess.run([str(binary_path)], check=True)
          PY
      - name: Archive
        env:
          scheme: ${{ steps.scheme.outputs.scheme }}
          filetype_parameter: ${{ steps.filetype_parameter.outputs.filetype_parameter }}
          file_to_build: ${{ steps.file_to_build.outputs.file_to_build }}
        run: xcodebuild archive -archivePath "$archive_path" -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -sdk iphoneos -arch arm64 -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO | xcpretty && exit ${PIPESTATUS[0]}
      - name: Tar Build Artifact
        run: tar -cvf "$archive_path.xcarchive.tar" "$archive_path.xcarchive"
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive_path }}.xcarchive.tar
          path: ${{ env.archive_path }}.xcarchive.tar

  package:
    name: Create fake-signed ipa
    runs-on: ubuntu-latest
    needs: [build]
    env:
      scheme: ${{ needs.build.outputs.scheme }}
      archive_path: ${{ needs.build.outputs.archive_path }}
    outputs:
      artifact: ${{ env.scheme }}.ipa

    steps:
      - name: Download a Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.archive_path }}.xcarchive.tar
      - name: Extract Build Artifact
        run: tar -xf "$archive_path.xcarchive.tar"
      - name: Install ldid
        run: |
          if [ `uname -s` = "Linux" ]; then
            curl -sSL -o /usr/local/bin/ldid "${{ github.server_url }}/ProcursusTeam/ldid/releases/latest/download/ldid_linux_`uname -m`"
            chmod +x /usr/local/bin/ldid
          elif [ `uname -s` = "Darwin" ]; then
            brew install ldid
          else
            exit 1
          fi
      - name: Fakesign
        run: |
          find "$archive_path.xcarchive/Products/Applications/$scheme.app" -type d -path '*/Frameworks/*.framework' -exec ldid -S \{\} \;
          ldid -S "$archive_path.xcarchive/Products/Applications/$scheme.app"
      - name: Create IPA
        run: |
          mv "$archive_path.xcarchive/Products/Applications" Payload
          zip -r "$scheme.ipa" "Payload" -x "._*" -x ".DS_Store" -x "__MACOSX"
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.scheme }}.ipa
          path: ${{ env.scheme }}.ipa

  release__nightly:
    name: Nightly Release
    permissions:
      contents: write
    if: inputs.release__nightly || github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    needs: [package]
    concurrency:
      group: release__nightly
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download a Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact }}
      - name: Update AltStore source
        id: update_source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          commit_sha: ${{ env.COMMIT_SHA }}
          commit_msg: ${{ env.COMMIT_MSG }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python update_json.py
      - name: Nightly Release
        uses: andelf/nightly-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: |
            This is a nightly release [created automatically with GitHub Actions workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}).
          files: |
            ${{ needs.package.outputs.artifact }}
            altstore.json
